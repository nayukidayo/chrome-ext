<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>工具箱</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>工具箱</h1>
      <span id="version" class="version"></span>
    </header>

    <section class="card">
      <div class="card-head">
        <h2>网络代理</h2>
        <span id="proxy-badge" class="pill">读取中…</span>
      </div>

      <div class="segmented" role="radiogroup" aria-label="代理模式">
        <button type="button" data-mode="proxy" role="radio" aria-checked="false">代理</button>
        <button type="button" data-mode="direct" role="radio" aria-checked="false">直连</button>
      </div>

      <label class="field">
        <span>代理地址</span>
        <input
          id="proxy-server"
          type="text"
          spellcheck="false"
          autocomplete="off"
          placeholder="http://127.0.0.1:10801"
        />
      </label>

      <p id="proxy-hint" class="hint">切换后对所有网站生效。</p>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>段落翻译</h2>
        <label class="switch" title="启用 / 停用段落翻译">
          <input type="checkbox" id="translate-toggle" />
          <span class="slider"></span>
        </label>
      </div>

      <p class="hint">
        按住 <kbd>右键</kbd> 向下划动（<kbd>↓</kbd>）→ 翻译手势起点处的段落。译文优先插在段落下方；
        链接、按钮或显示不开的位置改用气泡，滚动页面或点击别处即消失。
      </p>

      <div class="field region">
        <span>广州</span>
        <input
          id="api-key-guangzhou"
          type="password"
          spellcheck="false"
          autocomplete="off"
          aria-label="广州地域 TokenHub API Key"
          placeholder="sk-..."
        />
      </div>

      <div class="field region">
        <span>新加坡</span>
        <input
          id="api-key-singapore"
          type="password"
          spellcheck="false"
          autocomplete="off"
          aria-label="新加坡地域 TokenHub API Key"
          placeholder="sk-..."
        />
      </div>

      <p id="key-hint" class="hint muted">
        模型：hy-mt2-lite · 随机选一个地域，失败时自动切另一个
      </p>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>鼠标手势</h2>
        <label class="switch" title="启用 / 停用鼠标手势">
          <input type="checkbox" id="gesture-toggle" />
          <span class="slider"></span>
        </label>
      </div>

      <p class="hint">按住 <kbd>右键</kbd> 在页面中划动，每个方向需划出 30px 以上：</p>
      <ul class="gesture-list">
        <li><span class="moves"><kbd>↓</kbd></span>翻译起点处的段落</li>
        <li><span class="moves"><kbd>↓</kbd><kbd>→</kbd></span>关闭当前页面</li>
        <li><span class="moves"><kbd>↑</kbd><kbd>←</kbd></span>打开刚关闭的页面</li>
        <li><span class="moves"><kbd>↑</kbd><kbd>↓</kbd></span>刷新页面</li>
        <li><span class="moves"><kbd>←</kbd></span>后退（上一页）</li>
        <li><span class="moves"><kbd>→</kbd></span>前进（下一页）</li>
        <li><span class="moves"><kbd>↑</kbd></span>整个页面滚动到顶部</li>
      </ul>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
